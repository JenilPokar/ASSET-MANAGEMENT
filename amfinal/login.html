<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In - Asset Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F5F1; --surface: #FFFFFF; --ink: #1E2A26; --ink-soft: #55635C;
    --border: #D9DED7; --brand: #2B4C5C; --brand-dark: #1C333F; --accent: #D98E36; --danger:#B23A3A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--brand-dark);
    background-image: radial-gradient(circle at 20% 20%, rgba(217,142,54,0.08), transparent 40%),
                       radial-gradient(circle at 80% 80%, rgba(255,255,255,0.05), transparent 40%);
    font-family: 'Inter', sans-serif; color: var(--ink);
  }
  .card {
    background: var(--surface); border-radius: 8px; padding: 36px 34px; width: 340px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }
  .brand-mark { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.3rem; margin-bottom: 2px; }
  .brand-mark span { color: var(--accent); }
  .sub { font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 22px; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  label { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-soft); }
  input {
    padding: 9px 10px; border: 1px solid var(--border); border-radius: 5px; font-size: 0.92rem;
  }
  .btn {
    width: 100%; background: var(--brand); color: #fff; border: none; padding: 10px;
    border-radius: 5px; font-size: 0.92rem; cursor: pointer; margin-top: 6px;
  }
  .btn:hover { background: var(--brand-dark); }
  .flash.error { background: #FBEAEA; color: var(--danger); border: 1px solid #EFC6C6; padding: 8px 10px; border-radius: 5px; font-size: 0.82rem; margin-bottom: 14px; }
  .footer-note { margin-top: 22px; font-size: 0.68rem; color: var(--ink-soft); text-align: center; line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand-mark">ASSET<span>OS</span></div>
    <div class="sub">Multi-tenant asset lifecycle platform</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" required autofocus>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button class="btn" type="submit">Log In</button>
    </form>

    <div class="footer-note">
      Developed by Jenil Pokar &middot; Roll No. 46 &middot; FY AI-DS<br>
      Mapped to SDG 9 &middot; SDG 12 &middot; SDG 13
    </div>
  </div>
</body>
</html>
