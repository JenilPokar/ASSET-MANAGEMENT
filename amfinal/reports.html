{% extends "base.html" %}
{% import "_table.html" as t %}
{% block title %}Reports{% endblock %}
{% block content %}

<div class="panel">
  <h2>Reports</h2>
  <form method="GET" action="{{ url_for('reports') }}">
    <div class="form-row">
      <div class="field">
        <label>Report</label>
        <select name="report" onchange="this.form.submit()">
          {% for r in report_options %}
            <option value="{{ r }}" {{ 'selected' if r == selected_report else '' }}>{{ r }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
  </form>
</div>

<div class="panel">
  <h2>{{ selected_report }}</h2>
  {{ t.render_table(columns, rows) }}
</div>
{% endblock %}
